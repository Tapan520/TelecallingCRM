<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — TelecallingCRM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.85;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        p {
            color: #c7d2fe;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background: #4f46e5;
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #3730a3; }
        .status {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #818cf8;
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">??</div>
        <h1>You're Offline</h1>
        <p>
            It looks like you've lost your internet connection.<br />
            TelecallingCRM needs connectivity to load live data.<br />
            Please check your network and try again.
        </p>
        <button class="btn" onclick="window.location.reload()">?? Try Again</button>
        <div class="status">
            <span class="dot"></span> No internet connection detected
        </div>
    </div>
    <script>
        // Auto-reload when connection is restored
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
